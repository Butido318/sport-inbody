<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Do愛運動</title>
  <meta name="apple-mobile-web-app-title" content="Do愛運動"> 
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  
  <style>
/* ==========================================
   1. 網頁全域基礎設定（曜石暗綠黑）
   ========================================== */
html, body { 
  width: 100%; 
  margin: 0; 
  padding: 0; 
  overflow-x: hidden; 
  background-color: #121614 !important; /* 曜石底色 */
}
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  color: #ffffff; 
  font-size: 16px; 
} 
.container-fluid { padding: 12px; max-width: 1400px; }

/* ==========================================
   2. 頂部大標題（Do愛運動健康紀錄 - 升級質感純白）
   ========================================== */
h1, .main-title {
  color: #ffffff !important; /* 主標題改成大氣的純白 */
  font-weight: 800;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

/* ==========================================
   3. 區塊卡片與自訂標題（深灰岩石襯托 鈦銀/霓虹藍 質感）
   ========================================== */
.card { 
  background: #1e2421 !important; /* 高級深軍綠灰卡片 */
  border-radius: 16px; 
  border: 1px solid #2d3733 !important; /* 微光暗邊框 */
  box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important; 
  margin-bottom: 15px; 
  padding: 16px; 
  color: #ffffff !important;
}

/* 各卡片的大標題（如：InBody儀表板、健身紀錄） */
h2 { 
  color: #49c991 !important; /* 原本的香檳金改為亮眼運動綠 */
  font-weight: 800; 
  text-align: center; 
  margin-bottom: 15px; 
  font-size: 24px; 
}

/* 區域小標題（如：第一層：身體組成分析） */
h5 { 
  color: #d1dcd6 !important; /* 鈦金銀 */
  border-left: 5px solid #49c991 !important; /* 左側裝飾條：活力綠襯托 */
  padding-left: 10px; 
  margin-bottom: 15px; 
  font-weight: bold; 
  font-size: 18px; 
}

/* 項目提示塊或欄位名稱 */
h6 { 
  color: #ffffff !important; 
  font-weight: 800; 
  margin-top: 15px; 
  margin-bottom: 8px; 
  font-size: 15px; 
  background: #151917 !important; /* 深度內凹暗塊 */
  padding: 6px 10px; 
  border-radius: 6px; 
}

/* ==========================================
   4. 表格基本外殼與數據儲存格（全體底部邊框）
   ========================================== */
.table-responsive {
  position: relative;
  border-radius: 12px;
  overflow-x: auto;
  background: #2c3531; 
  border: 1px solid #3a4842; 
}
.inbody-table th, .inbody-table td {
  border-bottom: 1px solid #3a4842 !important; /* 細緻的暗灰色內部線 */
}
.col-data, .inbody-table td:not(.metric-name) {
  width: 75px;
  min-width: 75px;
  max-width: 75px;
  height: 56px;
  position: relative; 
  text-align: center;
  vertical-align: middle;
  padding: 0 !important;
  color: #ffffff; 
}

/* 確保文字和標籤置中 */
.cell-content {
  position: relative;
  z-index: 2; 
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  pointer-events: none; 
}

/* ==========================================
   5. 左側項目欄位與表頭凍結
   ========================================== */
.metric-name {
  font-weight: bold;
  background: #28322e !important; 
  color: #b2c0bc !important;      
  text-align: left !important;
  width: 105px;
  min-width: 105px;
  padding-left: 12px !important;
  position: -webkit-sticky;
  position: sticky;
  left: 0;
  z-index: 4; 
  border-right: 2px solid #3a4842 !important; 
}
.inbody-table th.metric-name {
  background: #232b28 !important; 
  color: #ffffff !important;
  position: -webkit-sticky;
  position: sticky;
  left: 0;
  z-index: 5;
}

/* ==========================================
   6. 微型畫布與特殊數據樣式設定
   ========================================== */
.cell-spark-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  z-index: 1; 
  pointer-events: none;
}
.row-spark-canvas {
  display: block;
  height: 100%;
  pointer-events: none;
}

/* 特殊數值警告與優良顏色調整 */
.val-warn div { color: #ffbc42 !important; } /* 警告：亮橘黃字 */
.val-good div { color: #2ecc71 !important; } /* 優良：亮綠字 */

/* ==========================================
   7. 數據變動霓虹活潑 Badge（🚀 配色優化核心）
   ========================================== */
.diff-badge {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: bold;
}
.diff-up {
  background-color: rgba(255, 107, 107, 0.18) !important;
  color: #ff7676 !important; /* 鮮豔霓虹紅 */
}
.diff-down {
  background-color: rgba(77, 173, 255, 0.18) !important;
  color: #5cc0ff !important; /* 清爽霓虹藍 */
}

/* ==========================================
   8. 輸入框、下拉選單深色岩石質感（告別突兀白框）
   ========================================== */
.form-control, select, input[type="password"], input[type="date"], input[type="number"], input[type="text"] {
  background-color: #252e2a !important; /* 內凹暗綠岩石底 */
  border: 1px solid #43524b !important;   /* 鈦銀質感的微亮外框 */
  color: #ffffff !important;            
  border-radius: 8px;
  padding: 8px 12px;
}
/* 當點擊輸入框時，邊框綻放活力綠微光 */
.form-control:focus, select:focus {
  border-color: #49c991 !important;
  box-shadow: 0 0 0 0.2rem rgba(73, 201, 145, 0.25) !important;
}
    
/* 🚀 儲存按鈕：升級為活潑跳出的運動霓虹綠漸層，搭配白字 */
    .btn-primary, .btn-success, button[onclick*="submitForm"] { 
      background: linear-gradient(135deg, #42b983, #34a873) !important;
      border: none !important; 
      height: 55px; 
      font-size: 18px; 
      font-weight: bold; 
      border-radius: 11px; 
      transition: 0.3s; 
      color: #ffffff !important; /* 改為白字，在霓虹綠上非常清晰活潑 */
      box-shadow: 0 4px 12px rgba(66, 185, 131, 0.2) !important;
    }
    .btn-primary:active, button[onclick*="submitForm"]:active { 
      background: linear-gradient(135deg, #5cd699, #42b983) !important;
      transform: translateY(2px); 
    }
    
    /* 🚀 右側力量大圖表容器（安全保留：維持高質感暗色底，不亮瞎眼） */
    .chart-container { 
      background-color: #19201d !important; /* 深軍綠黑內凹底 */
      border: 1px solid #2d3733 !important; 
      border-radius: 12px; 
      padding: 35px 5px 5px 5px; 
      position: relative; 
      width: 100%;
      min-height: 280px;
    }
    /* ==========================================
       8. 🎬 媒體顯示區域（保留原有全套核心縮放結構，微調底色）
       ========================================== */
    .media-wrapper {
      width: 100%;
      height: 180px;
      background-color: #252e2a !important; /* 修正：改成深色底才不會穿幫 */
      border-radius: 12px;
      border: 2px solid #2d3733 !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-wrapper img, .media-wrapper video, .media-wrapper iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ==========================================
       9. 📱 行動裝置 RWD 最佳化處理（完美保留不跑版）
       ========================================== */
    @media (max-width: 575.98px) {
      .row g-1 .col-4, .row g-1 .col-6 { padding-left: 3px !important; padding-right: 3px !important; }
      .form-control.px-1 { padding-left: 4px !important; padding-right: 4px !important; }
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <h2>🌿 Do愛運動健康紀錄</h2>

  <div class="row">
    
    <div class="col-12 col-md-5">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <h5>📊 InBody 儀表板</h5>
            <div id="lockScreen" class="inbody-locked text-center">
              <input type="password" id="unlockPwd" class="form-control mb-3" placeholder="輸入密碼查看數據">
              <button class="btn btn-outline-success w-100" style="font-size:16px;" onclick="checkPwd()">展開數據</button>
            </div>
            
            <div id="inbodyContent" style="display:none;">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-success">歷史趨勢整合於項目右側</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="lockInBody()">隱藏數據</button>
              </div>

              <h6>第一層：身體組成分析</h6>
              <div class="table-responsive mb-3">
                <table class="table inbody-table">
                  <thead id="headBodyComp"></thead>
                  <tbody id="dataBodyComp"></tbody>
                </table>
              </div>

              <h6>第二層：肌肉分佈 (Kg)</h6>
              <div class="table-responsive mb-3">
                <table class="table inbody-table">
                  <thead id="headMuscle"></thead>
                  <tbody id="dataMuscle"></tbody>
                </table>
              </div>

              <h6>第三層：脂肪分佈 (Kg)</h6>
              <div class="table-responsive">
                <table class="table inbody-table">
                  <thead id="headFat"></thead>
                  <tbody id="dataFat"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="card">
            <h5>⚙️ 健身紀錄</h5>
            <div class="mb-3">
              <label class="form-label">📅 訓練日期</label>
              <input type="date" id="logDate" class="form-control">
            </div>

            <div class="row g-1 mb-2">
              <div class="col-6">
                <label class="form-label">部位分類</label>
                <select id="catSelect" class="form-select" onchange="onCategoryChange()">
                  <option value="">載入中...</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">運動項目</label>
                <select id="itemSelect" class="form-select" onchange="onItemChange()">
                  <option value="">選擇部位</option>
                </select>
              </div>
            </div>

            <input type="text" id="newCatInput" class="form-control mb-2" style="font-size:16px; display:none;" placeholder="請輸入新部位">
            <input type="text" id="newItemInput" class="form-control mb-2" style="font-size:16px; display:none;" placeholder="請輸入新動作">
            
            <div class="mt-3">
              <div class="media-wrapper" id="mediaContainer">
                <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500" id="itemImg">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-7">
      <div class="card">
        <h5>📈 力量成長曲線 (最近 10 次數據)</h5>
        <div class="chart-container">
          <div id="chartStatus" class="text-muted text-center pt-5" style="font-size:16px; position:absolute; width:100%; z-index:2;">
            請先選擇運動項目
          </div>
          <canvas id="weightChart" style="width: 100%; height: 250px; display:none;"></canvas>
        </div>
      </div>

      <div class="card">
        <h5>💪 今日訓練成果</h5>
        <div class="row g-1 mb-4">
          <div class="col-4">
            <label class="form-label text-center d-block">重量</label>
            <input type="number" id="w" class="form-control text-center px-1" placeholder="kg" inputmode="decimal">
          </div>
          <div class="col-4">
            <label class="form-label text-center d-block">組數</label>
            <input type="number" id="s" class="form-control text-center px-1" placeholder="組" inputmode="numeric">
          </div>
          <div class="col-4">
            <label class="form-label text-center d-block">次數</label>
            <input type="number" id="r" class="form-control text-center px-1" placeholder="次" inputmode="numeric">
          </div>
        </div>
        <button id="saveBtn" class="btn btn-primary w-100" onclick="submitForm()">儲存紀錄至 Excel</button>
      </div>
    </div>

  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxTdrao1uUJS_PqrQ4-1Fxz4_foSfsqC4meWjL9RqHnGLxc8IwAC4WzKBpk8_s9ZWACCQ/exec";
  let activeInBodyCharts = []; 
  let fullMenuData = {};
  let myChart = null; 
  const DEFAULT_IMG = "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500";

  function checkPwd() {
    if (document.getElementById('unlockPwd').value === "3914") {
      fetchInBodyData();
    } else { alert("密碼錯誤！"); }
  }

  function lockInBody() {
    document.getElementById('lockScreen').style.display = 'block';
    document.getElementById('inbodyContent').style.display = 'none';
    document.getElementById('unlockPwd').value = "";
  }

  async function fetchInBodyData() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getInBody`);
      const data = await res.json();
      renderInBody(data);
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('inbodyContent').style.display = 'block';
    } catch (e) { alert("無法讀取 InBody 資料庫"); }
  }

/* ══════════════════════════════════════════════════════════════
   1. 渲染 InBody 表格主引擎 (全新微型格子畫布版)
   ══════════════════════════════════════════════════════════════ */
function renderInBody(raw) {
  if (!raw || raw.length < 2) return;

  // 安全清除舊圖表，避免 Chart.js 實例重複衝突
  if (typeof activeInBodyCharts !== 'undefined' && activeInBodyCharts.length > 0) {
    activeInBodyCharts.forEach(c => { if(c && typeof c.destroy === 'function') c.destroy(); });
    activeInBodyCharts = [];
  } else {
    window.activeInBodyCharts = [];
  }

  const originalDates = raw[0].slice(1); 
  // 🚀 自動支援任意天數！有多少天數據就直接往右延伸
  const sliceCount = originalDates.length; 
  const viewDates = originalDates.slice(0, sliceCount).reverse(); // 舊到新排序
  const rows = raw.slice(1);

  const tables = {
    bodyComp: { head: document.getElementById('headBodyComp'), data: document.getElementById('dataBodyComp'), html: "" },
    muscle: { head: document.getElementById('headMuscle'), data: document.getElementById('dataMuscle'), html: "" },
    fat: { head: document.getElementById('headFat'), data: document.getElementById('dataFat'), html: "" }
  };

  // 生成表頭 (確保包含凍結項目所需的 metric-name class)
  let headerHTML = `<tr><th class="metric-name">項目</th>`;
  viewDates.forEach(d => headerHTML += `<th class="col-data">${formatDate(d)}</th>`);
  headerHTML += `</tr>`; 
  
  if (tables.bodyComp.head) tables.bodyComp.head.innerHTML = headerHTML;
  if (tables.muscle.head) tables.muscle.head.innerHTML = headerHTML;
  if (tables.fat.head) tables.fat.head.innerHTML = headerHTML;

  rows.forEach((rowData, rowIndex) => {
    const name = rowData[0];
    const viewValues = rowData.slice(1).slice(0, sliceCount).reverse();        

    let rowHTML = `<tr><td class="metric-name">${name}</td>`;
    
    viewValues.forEach((v, i) => {
      let cellClass = "";
      if (name.includes("細胞外水比") && parseFloat(v) > 0.390) cellClass = "val-warn";
      if (name.includes("骨骼肌") && i === viewValues.length - 1) cellClass = "val-good";

      let diffHTML = "";
      if (i > 0 && !isNaN(parseFloat(v)) && !isNaN(parseFloat(viewValues[i-1]))) {
        const diff = (parseFloat(v) - parseFloat(viewValues[i-1])).toFixed(1);
        if (diff > 0) diffHTML = `<span class="diff-badge diff-up">▲${diff}</span>`;
        else if (diff < 0) diffHTML = `<span class="diff-badge diff-down">▼${Math.abs(diff)}</span>`;
      }

      // 🚀 關鍵核心：在每一個 td 儲存格裡埋入自己專屬的 Canvas (ID格式: canvas-r行-c列)
      const cellCanvasId = `canvas-r${rowIndex}-c${i}`;

      rowHTML += `
        <td class="${cellClass}">
          <div class="cell-content">
            <div style="font-weight:700; font-size:15px; margin-bottom:2px;">${v}</div>
            ${diffHTML}
          </div>
          <canvas id="${cellCanvasId}" class="cell-spark-canvas"></canvas>
        </td>`;
    });

    rowHTML += `</tr>`;

    // 依據 InBody 項目行數拆分到三層大標題中
    if (rowIndex < 7) {
      tables.bodyComp.html += rowHTML;
    } else if (rowIndex >= 7 && rowIndex < 12) {
      tables.muscle.html += rowHTML;
    } else {
      tables.fat.html += rowHTML;
    }

    // 🚀 安全非同步繪圖：把整行的歷史數值塞給格子去裁切，延遲 120 毫秒確保 HTML 已完全渲染到瀏覽器上
    setTimeout(() => {
      drawGridSparkline(rowIndex, viewValues);
    }, 120);
  });

  if (tables.bodyComp.data) tables.bodyComp.data.innerHTML = tables.bodyComp.html;
  if (tables.muscle.data) tables.muscle.data.innerHTML = tables.muscle.html;
  if (tables.fat.data) tables.fat.data.innerHTML = tables.fat.html;
}

/* ══════════════════════════════════════════════════════════════
   2. 格子獨立微型畫布繪製邏輯 (多天數自動對齊、淺灰質感線)
   ══════════════════════════════════════════════════════════════ */
/* ==========================================
   修正後的 drawGridSparkline 函式（完全體）
   ========================================= */
function drawGridSparkline(rowIndex, rowDataPoints) {
  const validValues = rowDataPoints.map(v => parseFloat(v)).filter(v => !isNaN(v));
  if (validValues.length === 0) return;
  
  const maxVal = Math.max(...validValues);
  const minVal = Math.min(...validValues);
  const valRange = maxVal - minVal;

  // 計算 Y 軸緩衝：保留上下 25% 的安全邊距，數字跟折線節點才不會打架
  const yMin = valRange === 0 ? minVal - 1 : minVal - (valRange * 0.25);
  const yMax = valRange === 0 ? maxVal + 1 : maxVal + (valRange * 0.25);

  // 🚀 【核心除蟲關鍵】大掃除！在畫新圖之前，確保完全銷毀舊物件，防止線條群魔亂舞、重疊交錯
  if (window.activeInBodyCharts && Array.isArray(window.activeInBodyCharts)) {
    window.activeInBodyCharts.forEach(chartInstance => {
      // 確保 chartInstance 物件存在且具有 destroy 函式才執行
      if (chartInstance && typeof chartInstance.destroy === 'function') {
        chartInstance.destroy(); 
      }
    });
    // 抹除完舊幽靈後，重新清空實例紀錄陣列，準備迎接新圖
    window.activeInBodyCharts = [];
  } else {
    // 萬一陣列不存在，幫忙建立一個
    window.activeInBodyCharts = [];
  }

  // 巡迴這行中的每一個儲存格 Canvas 進行繪製
  rowDataPoints.forEach((_, colIndex) => {
    const canvasId = `canvas-r${rowIndex}-c${colIndex}`;
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // 建立新的 Chart 物件（這時畫布是乾淨的）
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: rowDataPoints.map((_, idx) => idx),
        datasets: [{
          data: rowDataPoints,
          
          // 🚀 配色大升級：換上活潑活潑、醒目的霓虹「活力電光藍」線條
          borderColor: '#4dbdff', 
          borderWidth: 1.5,
          
          // 🚀 數據節點：升級成純白圓心 + 霓虹藍框發光的炫彩節點，極具動感
          pointRadius: 4,
          pointBackgroundColor: '#ffffff', // 圓心白色
          pointBorderColor: '#00ccff',     // 圓圈外框改用霓虹藍，讓點在深色底凸顯出來
          pointBorderWidth: 1.5,
          
          fill: false,
          tension: 0                    // 直折線 (比照 InBody 原廠風格)
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: 10,
            bottom: 14, // 留給升降 badge(▲▼) 空間
            left: colIndex === 0 ? 37.5 : 0,
            right: colIndex === rowDataPoints.length - 1 ? 37.5 : 0
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
          datalabels: { display: false }
        },
        scales: {
          // 黑科技動態裁剪：只保留目前這格到隔壁格子之間的線段線條
          x: {
            type: 'linear',
            display: false,
            min: colIndex === 0 ? 0 : colIndex - 0.5,
            max: colIndex === rowDataPoints.length - 1 ? colIndex : colIndex + 0.5
          },
          y: {
            display: false,
            min: yMin,
            max: yMax
          }
        }
      }
    });
    
    // 🚀 將新建立的圖表實例存起來，下次刷新時才能乾淨抹除
    if (window.activeInBodyCharts) {
      window.activeInBodyCharts.push(chart);
    }
  });
}

function formatDate(dateStr) {
  if (!dateStr) return "";
  
  // 1. 如果是標準物件，先轉成字串
  let str = dateStr.toString().trim();
  
  // 2. 如果包含 'T' (例如 2026-04-21T16:00:00.000Z)，先切出前面的日期部分
  if (str.includes('T')) {
    str = str.split('T')[0];
  }
  
  // 3. 把所有的橫線 '-' 統一替換成斜線 '/'
  str = str.replace(/-/g, '/');
  
  // 4. 解析 月 與 日
  const parts = str.split('/');
  if (parts.length >= 3) {
    // 如果是 yyyy/MM/dd 結構 (例如 2026/04/21)
    const month = parseInt(parts[1], 10);
    const day = parseInt(parts[2], 10);
    return `${month}/${day}`;
  } else if (parts.length === 2) {
    // 如果本來就已經是 MM/dd 結構
    const month = parseInt(parts[0], 10);
    const day = parseInt(parts[1], 10);
    return `${month}/${day}`;
  }
  
  return str; // 萬一都沒對上，才交還原字串
}

  function renderChart(historyData) {
    if (typeof Chart === 'undefined') return;
    const sortedData = [...historyData].reverse(); 
    const labels = sortedData.map(log => {
      if (log.date && log.date.includes('/')) {
        const p = log.date.split('/');
        return p.length >= 3 ? `${p[1]}/${p[2]}` : log.date;
      }
      return log.date || "";
    });
    
    const chartPoints = sortedData.map(log => {
      const content = log.displayContent ? log.displayContent.toString().trim() : "";
      let weight = 0, setRepStr = "";
      if (content.includes('*')) {
        const parts = content.split('*');
        weight = parseFloat(parts[0]) || 0;
        const rest = parts[1] || "";
        if (rest.includes('(') && rest.includes(')')) {
          const subParts = rest.split('(');
          setRepStr = `${subParts[0] || "0"}組/${(subParts[1] || "").replace(')', '')}次`;
        } else { setRepStr = rest ? `${rest}組` : ""; }
      } else { weight = parseFloat(content) || 0; }
      return { weight: weight, labelStr: setRepStr };
    });

    if (myChart) { myChart.destroy(); }
    const ctx = document.getElementById('weightChart').getContext('2d');
    myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: chartPoints.map(p => p.weight),
          borderColor: '#2e7d32', backgroundColor: '#81c784', borderWidth: 3, pointRadius: 6, fill: false, tension: 0.1
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 35, bottom: 5, left: 10, right: 10 } },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true },
          datalabels: {
            display: true, align: 'top', offset: 4, color: '#1b5e20', font: { size: 11, weight: 'bold' }, 
            formatter: function(value, context) {
              const pt = chartPoints[context.dataIndex];
              return (pt && pt.labelStr) ? `${value}kg\n(${pt.labelStr})` : `${value}kg`;
            },
            textAlign: 'center' 
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 12, weight: 'bold' }, color: '#2d4030' } },
          y: { ticks: { font: { size: 12, weight: 'bold' }, color: '#2d4030' }, grace: '35%' }
        }
      },
      plugins: (typeof ChartDataLabels !== 'undefined') ? [ChartDataLabels] : []
    });
  }

  function updateCategorySelect() {
    const catSelect = document.getElementById('catSelect');
    if (Object.keys(fullMenuData).length === 0) {
      catSelect.innerHTML = '<option value="">無設定資料</option>';
    } else {
      catSelect.innerHTML = '<option value="">-- 部位 --</option>';
      for (let cat in fullMenuData) { catSelect.options.add(new Option(cat, cat)); }
    }
    catSelect.options.add(new Option("+ 新增部位", "Other"));
  }
  
  function onCategoryChange() {
    const cat = document.getElementById('catSelect').value;
    const itemSelect = document.getElementById('itemSelect');
    document.getElementById('newCatInput').style.display = (cat === 'Other') ? 'block' : 'none';
    itemSelect.innerHTML = '<option value="">-- 動作 --</option>';
    if (cat && cat !== 'Other' && fullMenuData[cat]) {
      fullMenuData[cat].forEach(obj => itemSelect.options.add(new Option(obj.name, obj.name)));
    }
    itemSelect.options.add(new Option("+ 新增動作", "Other"));

  }

  function updateMediaDisplay(url) {
    const container = document.getElementById('mediaContainer');
    if (!url || url.trim() === "") {
      container.innerHTML = `<img src="${DEFAULT_IMG}">`;
      return;
    }
    const cleanUrl = url.trim();

    if (cleanUrl.includes("youtube.com") || cleanUrl.includes("youtu.be")) {
      let videoId = "";
      if (cleanUrl.includes("v=")) {
        videoId = cleanUrl.split("v=")[1].split("&")[0];
      } else if (cleanUrl.includes("youtu.be/")) {
        videoId = cleanUrl.split("youtu.be/")[1].split("?")[0];
      } else if (cleanUrl.includes("embed/")) {
        videoId = cleanUrl.split("embed/")[1].split("?")[0];
      }
      if(videoId) {
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
        return;
      }
    }

    const isVideoFile = cleanUrl.match(/\.(mp4|webm|mov|ogg)($|\?)/i) || cleanUrl.includes("video");
    if (isVideoFile) {
      container.innerHTML = `<video src="${cleanUrl}" controls loop muted playsinline></video>`;
      return;
    }
    container.innerHTML = `<img src="${cleanUrl}" onerror="this.src='${DEFAULT_IMG}';">`;
  }

function submitForm() {
  // 1. 安全取值：先檢查元件存在才抓值，避免 null 崩潰
  const dateEl = document.getElementById('date');
  const catEl  = document.getElementById('category');
  const itemEl = document.getElementById('item');
  
  if (!dateEl || !catEl || !itemEl) {
    return alert('系統錯誤：找不到基本的日期、部位或項目下拉選單元件！');
  }
  
  const dateVal = dateEl.value;
  const catSel  = catEl.value;
  const itemSel = itemEl.value;
  
  // 🚀 關鍵安全遞補：先確認新輸入框有在畫面上，才去讀取 value
  const newCatEl  = document.getElementById('newCategory');
  const newItemEl = document.getElementById('newItem');
  
  const finalCategory = (catSel === 'Other') ? (newCatEl ? newCatEl.value.trim() : '') : catSel;
  const finalItem     = (itemSel === 'Other') ? (newItemEl ? newItemEl.value.trim() : '') : itemSel;

  // 2. 驗證
  if (!dateVal) return alert('請選擇日期！');
  if (!finalCategory || finalCategory === '-- 部位 --') return alert('請選擇或填寫訓練部位！');
  if (!finalItem || finalItem === '選擇部位') return alert('請選擇或填寫運動項目！');

  // 3. 打包資料
  const form = {
    date: dateVal,
    category: finalCategory, 
    item: finalItem,         
    weight: document.getElementById('weight') ? document.getElementById('weight').value : '',
    sets: document.getElementById('sets') ? document.getElementById('sets').value : '',
    reps: document.getElementById('reps') ? document.getElementById('reps').value : ''
  };

  // 4. 按鈕動畫
  const btn = document.querySelector('button[onclick*="submitForm"]');
  let oriText = "儲存紀錄至 Excel";
  if (btn) {
    oriText = btn.innerHTML;
    btn.innerHTML = '核心數據寫入中...';
    btn.disabled = true;
  }

  // 5. 送出後端
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.innerHTML = oriText; btn.disabled = false; }
      
      const data = JSON.parse(res);
      if (data.status === 'success') {
        alert(data.message);
        
        if (typeof initWorkoutForm === 'function') {
          initWorkoutForm(); 
        }
        
        if (document.getElementById('newCategory')) document.getElementById('newCategory').value = '';
        if (document.getElementById('newItem')) document.getElementById('newItem').value = '';
        if (document.getElementById('weight')) document.getElementById('weight').value = '';
        if (document.getElementById('sets')) document.getElementById('sets').value = '';
        if (document.getElementById('reps')) document.getElementById('reps').value = '';
      } else {
        alert('儲存失敗：' + data.message);
      }
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.innerHTML = oriText; btn.disabled = false; }
      alert('連線失敗：' + err);
    })
    .saveLog(form); 
}
